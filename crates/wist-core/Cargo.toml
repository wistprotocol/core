[package]
name = "wist-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WIST protocol primitives: JCS, Ed25519 envelopes, Merkle trees, block verification, WIST-4 audit math"
repository = "https://github.com/wistprotocol/core"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
idna = "1"
idna_adapter = "=1.2.1"
icu_normalizer = "=2.0.0"
icu_properties = "=2.0.1"
zerovec = { version = "0.11", features = ["alloc"] }
thiserror = "1"
zstd = "0.13"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"
caseless = "0.2.2"
unicode-general-category = "1.1.0"

[dev-dependencies]
proptest = "1"
