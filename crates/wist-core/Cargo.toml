[package]
name = "wist-core"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WIST protocol primitives: JCS, Ed25519 envelopes, Merkle trees, block verification, WIST-4 audit math"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
proptest = "1"
