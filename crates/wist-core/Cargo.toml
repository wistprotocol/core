[package]
name = "wist-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WIST protocol primitives: JCS, Ed25519 envelopes, the Log's RFC 6962 tree, C2SP Checkpoints and tiles, Epoch verification, Declaration replay, parameter schedules"
repository = "https://github.com/wistprotocol/core"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ed25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
idna = "1"
idna_adapter = "=1.2.1"
icu_normalizer = "=2.0.0"
icu_properties = "=2.0.1"
zerovec = { version = "0.11", features = ["alloc"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"
